name: Daily guide page (agent)

on:
  schedule:
    - cron: "23 7 * * *"   # every day ~08:23 Morocco time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-page
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent writes today's page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent/daily_page.py
      - name: Publish
        run: |
          git config user.name "aoura-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily guide $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Wait for GitHub Pages
        run: sleep 120
      - name: Tell Bing/Yandex (IndexNow)
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          body = json.dumps({"host": "aouralive.github.io", "key": "dba241a6eed17d55d6d578fd899239b3",
                             "keyLocation": "https://aouralive.github.io/dba241a6eed17d55d6d578fd899239b3.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json"})
          try:
              print(urllib.request.urlopen(req, timeout=30).status)
          except Exception as e:
              print("IndexNow:", e)
          PY
      - name: Post to Telegram (if set up)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python agent/daily_page.py --telegram
